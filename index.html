<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para mi rayito ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#12070d,#3a0d1d,#170812);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;padding:24px;overflow:hidden}
.wrap{text-align:center;max-width:420px;width:100%}.hint{opacity:.75;font-size:14px;margin-bottom:24px}.envelope{width:280px;height:190px;margin:0 auto 28px;position:relative;cursor:pointer;filter:drop-shadow(0 20px 35px #0008)}.body{position:absolute;inset:0;background:#a91f45;border-radius:14px}.flap{position:absolute;left:0;top:0;width:0;height:0;border-left:140px solid transparent;border-right:140px solid transparent;border-top:105px solid #d94d70;transform-origin:top;transition:.7s;z-index:3}.letter{position:absolute;background:#fff8fb;color:#5b1830;width:238px;min-height:155px;left:21px;top:28px;border-radius:8px;padding:22px 18px;z-index:2;transition:.8s;box-shadow:0 4px 15px #0003;font-size:17px;line-height:1.45}.heart{position:absolute;font-size:30px;opacity:.9;animation:float 5s infinite ease-in-out}.h1{left:8%;top:18%}.h2{right:9%;top:28%;animation-delay:1s}.h3{left:15%;bottom:15%;animation-delay:2s}.h4{right:14%;bottom:12%;animation-delay:3s}@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}.open .flap{transform:rotateX(180deg)}.open .letter{transform:translateY(-95px);z-index:4}.message{opacity:0;transform:translateY(12px);transition:1s .45s;font-size:20px;line-height:1.55}.open+.message{opacity:1;transform:none}.small{margin-top:18px;opacity:.65;font-size:13px}.envelope{border:0;padding:0;background:none;display:block}.envelope:focus-visible{outline:3px solid #fff;border-radius:16px}.message.show{opacity:1;transform:none}
</style>
</head>
<body>
<div class="heart h1">❤️</div><div class="heart h2">✨</div><div class="heart h3">❤️</div><div class="heart h4">✨</div>
<main class="wrap">
<div class="hint">Toca el sobre 💌</div>
<button class="envelope" id="env" aria-label="Abrir carta" type="button">
<div class="body"></div>
<div class="letter">Hay algo que quería decirte…</div>
<div class="flap"></div>
</button>
<div class="message" id="msg">
Yo te esperaré hasta que decidas intentarlo,<br>
porque te amo un mundo,<br>
<strong>mi rayito, mi alpinito, mi mona. ❤️</strong>
</div>
<div class="small">Hecho con mucho cariño.</div>
</main>
<script>
const e=document.getElementById('env'); const m=document.getElementById('msg'); e.addEventListener('click',()=>{const open=e.classList.toggle('open');m.classList.toggle('show',open);});
</script>
</body>
</html>
